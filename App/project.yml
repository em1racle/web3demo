name: Web3Demo
options:
  bundleIdPrefix: dev.web3demo
  deploymentTarget:
    iOS: "17.0"
packages:
  RealtimeFeed:
    path: ../RealtimeFeed
targets:
  Web3Demo:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: RealtimeFeed
      - framework: ../shared/build/XCFrameworks/debug/Shared.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.web3demo.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Sign wallet messages with your hardware-backed key."
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
  Web3DemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Web3Demo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.web3demo.uitests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Web3Demo
