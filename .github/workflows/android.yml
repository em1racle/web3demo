name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests (shared business logic — same module the app runs)
        run: ./gradlew :shared:jvmTest

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

  # Play Store publishing (gradle-play-publisher) needs a service account JSON stored as a
  # secret, plus a release signing config — neither is set up in this repo. See RELEASE.md.
